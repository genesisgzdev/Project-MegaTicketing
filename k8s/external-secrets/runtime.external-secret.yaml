apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: megaticketing-runtime
  namespace: megaticketing-prod
  annotations:
    megaticketing.dev/apply: "forbidden-until-observed"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: megaticketing-gsm
    kind: ClusterSecretStore
  target:
    name: megaticketing-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: megaticketing/prod/database-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: megaticketing/prod/jwt-secret
    - secretKey: JWT_ISSUER
      remoteRef:
        key: megaticketing/prod/jwt-issuer
    - secretKey: JWT_AUDIENCE
      remoteRef:
        key: megaticketing/prod/jwt-audience
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: megaticketing/prod/stripe-secret
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: megaticketing/prod/stripe-webhook
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: megaticketing/prod/redis-password
