name: Production Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag'
        required: true
        default: 'v2.1.0'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body: |
            MegaTicketing v2.1.0: PostgreSQL-authoritative reservations, live seat inventory, Stripe idempotency, Redis locking, and a verified 40,000-request concurrency gate.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
