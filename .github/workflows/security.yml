name: Industrial Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Stack (Docker)
        run: |
          docker compose build

      - name: Snyk Security Audit
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            npx --yes snyk test --token=${{ secrets.SNYK_TOKEN }} --all-projects --severity-threshold=high
          else
            echo "Skipping Snyk: No token provided."
          fi

      - name: OSV-Scanner
        run: |
          docker run --rm -v $(pwd):/src ghcr.io/google/osv-scanner:latest /src -r || true
