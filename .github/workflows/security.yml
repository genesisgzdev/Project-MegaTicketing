name: Industrial Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CI Environment
        run: |
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=password" >> .env
          echo "DB_NAME=megaticketing" >> .env
          echo "STRIPE_SECRET_KEY=sk_test_placeholder" >> .env
          echo "JWT_SECRET=placeholder_at_least_32_chars_long" >> .env
          echo "GCP_PROJECT_ID=ci-project" >> .env

      - name: Docker Build Validation
        run: docker compose build

      - name: Snyk Security Audit (Node.js)
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            npx --yes snyk test --token=${{ secrets.SNYK_TOKEN }} --all-projects --severity-threshold=high
          else
            echo "::warning::SNYK_TOKEN not found. Skipping dependency scan."
          fi

      - name: OSV-Scanner Audit
        run: |
          docker run --rm -v $(pwd):/src ghcr.io/google/osv-scanner:latest /src scan source -r /src
