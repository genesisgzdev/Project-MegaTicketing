name: Industrial Security Pipeline 2026

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write
  actions: read

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Container Orchestration
        run: |
          export DB_PASSWORD=placeholder
          export STRIPE_SECRET_KEY=sk_test_placeholder
          export JWT_SECRET=placeholder_at_least_32_chars_long
          docker compose build

  snyk-sca-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Snyk
        uses: snyk/actions/setup@master
        with:
          snyk-version: 'latest'
      - name: Run Snyk SCA
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_OIDC_ENABLED: true

  osv-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV-Scanner (v2 Syntax)
        uses: google/osv-scanner-action/scan@v1
        with:
          scan-args: "scan source -r ./"
