name: Security and Runtime Gate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  audit-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client from the checked-in schema
        run: npx prisma generate --schema packages/database/prisma/schema.prisma
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Compile every workspace
        run: npm run build
      - name: Run tests
        run: npm test -- --run
