name: Industrial Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Monorepo Build (Docker Compose)
        run: |
          # Use placeholders for build-time secrets to ensure docker-compose config passes
          export DB_PASSWORD=placeholder
          export STRIPE_SECRET_KEY=sk_test_placeholder
          export JWT_SECRET=placeholder_at_least_32_chars_long
          docker compose build

  snyk-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js (Required for Snyk context)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snyk SCA Test
        run: |
          npx --yes snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/scan@v1
        with:
          scan-args: |-
            --recursive
            ./
