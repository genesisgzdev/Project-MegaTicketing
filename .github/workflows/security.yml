name: Security and Runtime Gate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  audit-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma Client from the current schema
        run: npm run db:generate
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Compile every workspace
        run: npm run build
      - name: Build API production image
        run: docker build --tag megaticketing-api:${{ github.sha }} .
      - name: Push integration schema
        run: npm run db:push -- --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/megaticketing
      - name: Run web tests
        run: npm test
      - name: Run API unit tests
        run: npm run test:api
      - name: Run PostgreSQL and Redis integration tests
        run: npm run test:api:integration
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/megaticketing
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
          AUTH_TEST_BYPASS: 'true'
          STRIPE_SECRET_KEY: sk_test_ci
          JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: megaticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d megaticketing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
