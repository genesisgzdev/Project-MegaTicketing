name: Delivery Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'k8s/**'
      - 'deploy/**'
      - '.github/workflows/delivery-plan.yml'
      - '.github/workflows/deploy.yml'

jobs:
  contracts-without-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require secret and promotion contracts
        run: |
          test -f deploy/secrets/CONTRACT.md
          test -f k8s/external-secrets/runtime.external-secret.yaml
          test -f k8s/helm/megaticketing/Chart.yaml
          grep -q 'applyEnabled: false' k8s/helm/megaticketing/values.yaml
      - name: Lint Helm chart without installing
        run: helm lint k8s/helm/megaticketing
      - name: Refuse implicit apply
        run: |
          echo "Delivery remains plan-only. This job does not push images, apply Terraform, or install Helm."
