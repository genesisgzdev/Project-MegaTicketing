name: Infrastructure Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/deploy.yml'

jobs:
  terraform-and-target-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Validate Cloudflare module
        run: |
          terraform -chdir=infra/cloudflare init -backend=false
          terraform -chdir=infra/cloudflare validate
      - name: Validate GCP and Kubernetes configuration
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
      - name: Preflight Kubernetes deployment target
        run: |
          if [ ! -d k8s/helm/megaticketing ]; then
            echo "::notice::Kubernetes deployment skipped: k8s/helm/megaticketing does not exist in this repository. No Helm release is applied."
            exit 0
          fi
          helm lint k8s/helm/megaticketing
      - name: State deployment boundary
        run: |
          echo "Infrastructure preflight only. This workflow does not apply Terraform, push images, or deploy Kubernetes."
